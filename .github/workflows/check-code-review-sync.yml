name: Check managed Codex review caller

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            %w[
              .github/workflows/code-review.yml
              .github/workflows/codex-pr-review.yml
              workflow-templates/code-review.yml
            ].each { |path| YAML.load_file(path) }
            puts "workflow YAML OK"
          '

      - name: Run synchronization tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax and whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          git diff --check
