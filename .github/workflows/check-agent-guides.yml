name: Check agent guides

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Codex and Claude guides are synchronized
        shell: bash
        run: |
          set -euo pipefail

          tracked_blob_oid() {
            local path="$1"
            local expected_mode="${2:-100644}"
            local entry mode oid stage tracked_path

            entry="$(git ls-files --stage -- "${path}")"
            if [[ -z "${entry}" || "${entry}" == *$'\n'* ]]; then
              echo "::error::${path} must have exactly one tracked index entry" >&2
              return 1
            fi

            IFS=$' \t' read -r mode oid stage tracked_path <<< "${entry}"
            if [[ "${mode}" != "${expected_mode}" || "${stage}" != "0" || "${tracked_path}" != "${path}" ]]; then
              echo "::error::${path} must have tracked mode ${expected_mode}" >&2
              return 1
            fi

            printf '%s\n' "${oid}"
          }

          check_symlink() {
            local path="$1"
            local target="$2"
            local actual_oid expected_oid

            actual_oid="$(tracked_blob_oid "${path}" 120000)" || return 1
            expected_oid="$(printf '%s' "${target}" | git hash-object --stdin)"
            if [[ "${actual_oid}" != "${expected_oid}" ]]; then
              echo "::error::${path} must use its fixed relative symlink target" >&2
              return 1
            fi
          }

          # Inspect index modes and link blob identities only; never follow
          # PR-controlled filesystem links or print their targets/content.
          tracked_blob_oid AGENTS.md >/dev/null
          tracked_blob_oid .agents/skills/maintain-review-automation/SKILL.md >/dev/null
          tracked_blob_oid .agents/skills/maintain-review-automation/agents/openai.yaml >/dev/null
          check_symlink CLAUDE.md AGENTS.md
          check_symlink .claude/skills ../.agents/skills
