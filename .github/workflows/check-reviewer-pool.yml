name: Check reviewer runner pool

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: codex-reviewer-pool-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'mobilint/.github' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Pool probe ${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on:
      group: codex
      labels: codex-reviewer
    timeout-minutes: 5
    steps:
      - name: Check runner readiness
        shell: bash
        run: |
          set -euo pipefail
          for command in gh git jq python3 codex; do
            command -v "${command}" >/dev/null
          done
          codex sandbox sh -lc 'true'
          printf 'Runner: %s\nRun: %s\n' "${RUNNER_NAME}" "${GITHUB_RUN_ID}"
          printf 'Runner: `%s`\n' "${RUNNER_NAME}" >> "${GITHUB_STEP_SUMMARY}"
          # Keep the first runner occupied briefly so an idle peer can take
          # the second job. Compare job runner names and overlapping times.
          sleep 20
